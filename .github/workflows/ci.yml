name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, macos-latest, windows-latest ]
        node-version: [ 18.x, 20.x, 22.x, 24.x ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Environment
        run: |
          node --version
          npm --version

      - name: Run Syntax & Lint Checks
        run: npm run lint

      - name: Validate Agentic Architecture
        run: npm run validate

      - name: Run Test Suite
        run: npm test

  coverage:
    name: 100.00% Coverage Gate (Node 24)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      # Native 100% threshold flags require Node >=22.8.0 (see scripts/test_coverage.js),
      # so the coverage gate runs once on the newest runtime instead of every matrix cell.
      - name: Verify 100.00% Test Coverage Gates
        run: npm run test:coverage

  security:
    name: Secret & Vulnerability Scans
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
