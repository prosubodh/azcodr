name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Verify the publishable tarball without uploading"
        type: boolean
        default: true

# Least privilege: read the repo, write only the npm registry.
permissions:
  contents: read
  id-token: write # npm trusted publishing / provenance attestation

# Never let two release runs race the same version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Before Publishing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify Environment
        run: |
          node --version
          npm --version

      # Re-run the full gate on the exact release tag. prepublishOnly also runs
      # on `npm publish`, but failing fast here avoids building a tarball at all.
      - name: Run Syntax & Lint Checks
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Verify Coverage Gates
        run: npm run test:coverage

      - name: Validate Agentic Architecture
        run: npm run validate

      - name: Verify version matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version $pkg_version matches tag $GITHUB_REF_NAME"

      - name: Inspect the publishable tarball
        run: |
          set -euo pipefail
          npm pack --dry-run
          # Prove the tarball actually carries the files the package promises,
          # rather than trusting the files[] allowlist to be correct.
          # npm writes UTF-16LE on Windows, so parse it as text, not via require.
          npm pack --json > pack.json
          node -e '
            const fs = require("fs");
            let raw = fs.readFileSync("pack.json", "utf-8");
            if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
            // npm writes UTF-16LE on Windows, so utf-8 decoding yields NUL
            // padding. Detect it and re-read. Use an escape, never a literal
            // NUL byte: an embedded 0x00 makes git classify this file as
            // binary, which breaks the workflow.
            if (raw.indexOf(String.fromCharCode(0)) !== -1) {
              raw = fs.readFileSync("pack.json", "utf16le");
              if (raw.charCodeAt(0) === 0xFEFF) raw = raw.slice(1);
            }
            const meta = JSON.parse(raw)[0];
            const files = new Set(meta.files.map((f) => f.path));
            const required = [
              "package.json", "README.md", "LICENSE",
              "bin/azcodr.js", "lib/index.js", "lib/index.d.ts", "lib/scaffold.js",
              "scripts/validate.js", "scripts/validate-cli.js"
            ];
            const missing = required.filter((f) => !files.has(f));
            if (missing.length) {
              console.error("::error::missing from tarball: " + missing.join(", "));
              process.exit(1);
            }
            console.log("tarball contains all " + required.length + " required paths");
          '

      - name: Install the packed tarball and smoke-test the CLI
        run: |
          set -euo pipefail
          # The highest-value missing check: the published artifact must be
          # runnable, not just constructible.
          npm pack > /dev/null
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null 2>&1
          npm install "$GITHUB_WORKSPACE"/*.tgz --no-audit --no-fund
          npx azcodr --version
          npx azcodr --help > /dev/null
          node -e '
            const api = require("azcodr");
            const required = ["scaffold", "copyTemplate", "validateTarget", "ERROR_CODES", "ScaffoldError"];
            const missing = required.filter((k) => !(k in api));
            if (missing.length) { console.error("missing exports: " + missing.join(", ")); process.exit(1); }
            if (api.ERROR_CODES.E_GIT_BLOCKED !== "Blocked git subcommand") {
              console.error("error-code contract changed unexpectedly");
              process.exit(1);
            }
            console.log("programmatic API surface verified");
          '

      - name: Scaffold a real project from the packed tarball
        run: |
          set -euo pipefail
          cd /tmp/smoke
          npx azcodr ./generated --force --no-git
          cd ./generated
          npm run validate

  publish-npm:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Verify the working tree is clean
        run: |
          set -euo pipefail
          # Publishing from a dirty tree ships files that are not in any tag and
          # cannot be reproduced later.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty; refusing to publish"
            git status --porcelain
            exit 1
          fi

      - name: Re-run the publish gate
        # prepublishOnly fires on npm publish: lint -> coverage -> validate.
        run: npm run lint && npm run test:coverage && npm run validate

      - name: Dry run (no upload)
        if: inputs.dry-run == true
        run: npm publish --dry-run --access public

      - name: Publish to npm
        if: inputs.dry-run != true
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-jsr:
    name: Publish to JSR
    needs: verify
    # Requires a native ESM entrypoint. The npm package is CommonJS, which JSR
    # explicitly forbids ("You cannot publish CommonJS modules"). Disabled with
    # a stated reason rather than failing every release.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        run: npx jsr publish