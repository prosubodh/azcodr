name: Feature Request
description: Propose a new capability or enhancement
title: "[feat] "
labels: ["type:feature", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user value
      description: What problem does this solve and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must
        - Should
        - Could
        - Won't (this time)
    validations:
      required: true